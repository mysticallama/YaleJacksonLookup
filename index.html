<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jackson Lookup</title>
  <meta name="description" content="Search Yale Jackson MPP students by policy area and region." />
  <meta property="og:title" content="Jackson Lookup" />
  <meta property="og:description" content="Search Yale Jackson MPP students by policy area and region." />
  <meta property="og:image" content="https://mysticallama.github.io/YaleJacksonLookup/photos/shield.png" />
  <meta property="og:url" content="https://mysticallama.github.io/YaleJacksonLookup/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" href="photos/shield.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="#/" class="logo"><img class="logo-shield" src="photos/shield.png" alt="" onerror="this.remove()">Jackson<span>Lookup</span></a>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <section class="contact-section">
    <div class="wrap">
      <div class="contact-card">
        <div class="contact-heading">Suggestions or questions?</div>
        <form id="contact-form" autocomplete="off">
          <input type="text" name="_honey" style="display:none" tabindex="-1">
          <input type="email" name="email" id="contact-email" placeholder="Your email" required>
          <textarea name="message" id="contact-message" placeholder="Your message" rows="3" required></textarea>
          <button type="submit" id="contact-submit">Send</button>
          <div id="contact-status" role="status"></div>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      Built from the public Yale Jackson School student directory. Not affiliated with Yale.
      You can also email <a class="footer-email" href="mailto:kevin.chen.kc2593@yale.edu">kevin.chen.kc2593@yale.edu</a> directly.
      <a class="footer-link" href="https://github.com/mysticallama/YaleJacksonLookup" target="_blank" rel="noopener">View on GitHub ↗</a>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
